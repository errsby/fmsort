<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="discShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Outer Vinyl Disc -->
  <circle cx="256" cy="256" r="180" fill="#121217" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
  <circle cx="256" cy="256" r="180" fill="url(#discShine)" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="126" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="108" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- Dynamic Center Label -->
  <circle cx="256" cy="256" r="76" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="76" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="22" fill="#09090c" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Stylized F / Waveform Equalizer Accent -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="220" y="238" width="6" height="36" rx="3" />
    <rect x="232" y="226" width="6" height="60" rx="3" />
    <rect x="244" y="214" width="6" height="84" rx="3" />
    <rect x="256" y="206" width="6" height="100" rx="3" fill="#38bdf8" />
    <rect x="268" y="214" width="6" height="84" rx="3" />
    <rect x="280" y="226" width="6" height="60" rx="3" />
    <rect x="292" y="238" width="6" height="36" rx="3" />
  </g>
</svg>